<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>약 안전 판정소</title>
<style>
:root{
  --mint:#c9f1e5; --mint-dark:#3b9b87; --sky:#ccecff; --sky-dark:#438fc0;
  --yellow:#ffe79b; --cream:#fffdf5; --ink:#284b58; --pink:#ffd9df;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink)}
body{background:linear-gradient(135deg,#e5faf2 0%,#e8f5ff 55%,#fff8d9 100%);min-height:100vh;display:grid;place-items:center;padding:20px;overflow-x:hidden}
.app{width:min(1200px,100%);min-height:min(675px,calc(100vh - 40px));aspect-ratio:16/9;background:rgba(255,253,245,.92);border:5px solid white;border-radius:34px;box-shadow:0 18px 50px #79b9b044;position:relative;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:70px;padding:18px 30px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:17px;font-weight:900;letter-spacing:.04em;color:#479887}
.dots{display:flex;gap:7px}.dots span{width:10px;height:10px;border-radius:50%;background:#bde8dd}.dots span:nth-child(2){background:#c3e5fa}.dots span:nth-child(3){background:#ffe18c}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 38px 36px;position:relative}
.screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
h1{font-size:clamp(34px,4.4vw,62px);line-height:1.15;margin:0 0 14px;font-weight:1000;letter-spacing:-.055em;color:#286b6c}
.subtitle{font-size:clamp(20px,2.3vw,30px);font-weight:800;margin:0 0 28px}
.decor{position:absolute;font-size:clamp(34px,5vw,64px);filter:drop-shadow(0 6px 0 #244c5810);animation:float 3.2s ease-in-out infinite}
.d1{left:10%;top:14%;transform:rotate(-13deg)}.d2{right:11%;top:15%;animation-delay:.6s}.d3{left:15%;bottom:12%;animation-delay:1s}.d4{right:14%;bottom:11%;animation-delay:.3s}
.machine{width:clamp(170px,20vw,245px);height:clamp(190px,23vw,260px);position:relative;margin:0 auto 24px}
.machine-top{position:absolute;left:8%;top:0;width:84%;height:34%;background:#bce9df;border:5px solid white;border-radius:25px 25px 13px 13px;box-shadow:inset 0 -7px #8bd4c2}
.machine-top:before{content:"";position:absolute;left:13%;right:13%;top:18%;height:47%;border-radius:50%;background:#f9fffc;border:4px solid #8bd4c2}
.machine-neck{position:absolute;left:24%;top:30%;width:52%;height:14%;background:#7fcbbb;border:4px solid white;border-radius:8px}
.machine-body{position:absolute;left:0;right:0;bottom:0;height:63%;border:5px solid white;border-radius:28px;background:linear-gradient(90deg,#a8e1d5,#d8f6ed 45%,#a8e1d5);box-shadow:inset 0 -9px #7fcbbb}
.machine-window{position:absolute;left:12%;right:12%;top:10%;height:53%;border:4px solid #fff;background:#e9fbff;border-radius:18px;overflow:hidden;display:grid;place-items:center}
.capsule{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#ffdf82 0 48%,#fff5c9 49% 100%);border:5px solid white;box-shadow:0 7px 0 #e6c66a;display:grid;place-items:center;font-size:35px;transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.machine-slot{position:absolute;left:27%;right:27%;bottom:7%;height:17%;background:#5faaa0;border:4px solid white;border-radius:9px}
.button{border:0;border-radius:18px;padding:17px 34px;font-family:inherit;font-size:clamp(19px,2vw,25px);font-weight:900;cursor:pointer;color:#28515a;background:var(--yellow);box-shadow:0 7px 0 #e6c968;transition:transform .15s,box-shadow .15s}
.button:hover{transform:translateY(-2px);box-shadow:0 9px 0 #e6c968}.button:active{transform:translateY(4px);box-shadow:0 3px 0 #e6c968}.button:focus-visible{outline:4px solid #428ec0;outline-offset:4px}
.button.secondary{background:#bfe8fb;box-shadow:0 7px 0 #8fc9e6}.button.secondary:hover{box-shadow:0 9px 0 #8fc9e6}.button.secondary:active{box-shadow:0 3px 0 #8fc9e6}
.hint{font-size:15px;color:#72919a;margin-top:18px;font-weight:700}
.result-layout{width:100%;display:grid;grid-template-columns:.8fr 1.2fr;gap:34px;align-items:center;max-width:1000px;text-align:left}
.result-art{height:330px;display:grid;place-items:center;position:relative;background:#e8f8f5;border:4px solid white;border-radius:30px;box-shadow:0 8px 0 #c6e9df;overflow:hidden}
.result-art:before,.result-art:after{content:"";position:absolute;border-radius:50%;background:#ccecff;opacity:.7}.result-art:before{width:150px;height:150px;left:-35px;top:-35px}.result-art:after{width:120px;height:120px;right:-25px;bottom:-25px;background:#ffe79b}
.art-emoji{font-size:clamp(78px,10vw,128px);position:relative;z-index:1;filter:drop-shadow(0 7px 0 #284b5810);animation:pop .45s ease-out}
.result-content{display:flex;flex-direction:column;align-items:flex-start}
.eyebrow{font-size:16px;font-weight:900;color:#439887;background:#d9f4eb;padding:8px 14px;border-radius:100px;margin-bottom:15px}
.scenario{font-size:clamp(24px,2.6vw,35px);font-weight:900;line-height:1.55;letter-spacing:-.035em;margin:0 0 25px}
.result-buttons{display:flex;gap:13px;flex-wrap:wrap}
.hidden{display:none!important}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes pop{0%{transform:scale(.55) rotate(-10deg);opacity:0}70%{transform:scale(1.08) rotate(4deg)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.machine.spinning .capsule{animation:shake .18s linear infinite;transform:scale(1.08)}
@media(max-width:720px){body{padding:8px}.app{aspect-ratio:auto;min-height:calc(100vh - 16px);border-radius:22px}.topbar{height:55px;padding:12px 18px}main{padding:12px 18px 26px}.decor{font-size:30px}.d1{left:3%;top:5%}.d2{right:3%;top:5%}.d3{left:4%;bottom:5%}.d4{right:4%;bottom:5%}.result-layout{grid-template-columns:1fr;gap:18px;max-width:500px}.result-art{height:180px}.art-emoji{font-size:76px}.result-content{align-items:center;text-align:center}.scenario{font-size:23px;margin-bottom:18px}.result-buttons{justify-content:center}.button{padding:14px 23px}.machine{margin-bottom:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">✦ 어떤 상황일까요?</div>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
  <main>
    <div class="decor d1" aria-hidden="true">☀️</div><div class="decor d2" aria-hidden="true">🩹</div>
    <div class="decor d3" aria-hidden="true">💊</div><div class="decor d4" aria-hidden="true">✨</div>
    <section id="home" class="screen">
      <h1>약 안전 판정소</h1>
      <p class="subtitle">이 약, 먹어도 괜찮을까요?</p>
      <div class="machine" id="machine" aria-hidden="true">
        <div class="machine-top"></div><div class="machine-neck"></div>
        <div class="machine-body"><div class="machine-window"><div class="capsule" id="machineCapsule">💊</div></div><div class="machine-slot"></div></div>
      </div>
      <button class="button" id="drawBtn">🎲 상황 뽑기</button>
      <p class="hint">캡슐을 열어 어떤 상황인지 확인해 보세요!</p>
    </section>
    <section id="result" class="screen hidden" aria-live="polite">
      <div class="result-layout">
        <div class="result-art"><div class="art-emoji" id="artEmoji">💊</div></div>
        <div class="result-content">
          <div class="eyebrow">💭 이 약을 먹어도 될까요?</div>
          <p class="scenario" id="scenarioText"></p>
          <div class="result-buttons">
            <button class="button secondary" id="againBtn">🎁 다른 상황 뽑기</button>
            <button class="button" id="homeBtn">⌂ 처음으로</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<script>
const situations = [
 {text:"길을 걷다가 길에 떨어져 있는 약을 발견했어요.", emoji:"🔎💊"},
 {text:"약을 햇빛이 드는 창가에 오래 두었더니 모양과 색깔이 달라졌어요.", emoji:"☀️💊"},
 {text:"약을 어디에 두었는지, 어떻게 보관했는지 기억나지 않아요.", emoji:"🤔📦"},
 {text:"약을 오래전에 받아 두었는데, 언제 받은 약인지 모르겠어요.", emoji:"📅💊"},
 {text:"약 포장이 뜯어져 있고, 안에 든 약이 무엇인지 정확히 알 수 없어요.", emoji:"📦❓"},
 {text:"약을 보관하던 곳에 물이 들어가 약 포장이 젖었어요.", emoji:"💧📦"},
 {text:"약을 먹으려고 하는데 포장에 적힌 설명을 읽어 보지 않았어요.", emoji:"📄💊"},
 {text:"약을 보관하던 곳이 너무 덥거나 습한 곳이었어요.", emoji:"🌡️💧"}
];
const home = document.getElementById("home");
const result = document.getElementById("result");
const machine = document.getElementById("machine");
const drawBtn = document.getElementById("drawBtn");
const againBtn = document.getElementById("againBtn");
const homeBtn = document.getElementById("homeBtn");
const scenarioText = document.getElementById("scenarioText");
const artEmoji = document.getElementById("artEmoji");
let previousIndex = -1;
let busy = false;

function pickSituation(){
  let index;
  do { index = Math.floor(Math.random() * situations.length); } while(index === previousIndex);
  previousIndex = index;
  return situations[index];
}
function draw(){
  if(busy) return;
  busy = true;
  home.classList.add("hidden");
  result.classList.add("hidden");
  home.classList.remove("hidden");
  machine.classList.add("spinning");
  drawBtn.disabled = true;
  drawBtn.textContent = "✨ 캡슐을 준비하고 있어요...";
  window.setTimeout(() => {
    const item = pickSituation();
    scenarioText.textContent = item.text;
    artEmoji.textContent = item.emoji;
    machine.classList.remove("spinning");
    home.classList.add("hidden");
    result.classList.remove("hidden");
    drawBtn.disabled = false;
    drawBtn.textContent = "🎲 상황 뽑기";
    busy = false;
  }, 850);
}
function goHome(){
  result.classList.add("hidden");
  home.classList.remove("hidden");
  machine.classList.remove("spinning");
}
drawBtn.addEventListener("click", draw);
againBtn.addEventListener("click", draw);
homeBtn.addEventListener("click", goHome);
</script>
</body>
</html>
